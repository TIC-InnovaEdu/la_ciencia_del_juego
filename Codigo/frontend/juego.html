<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calificar Servicio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        }
        .stars {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }
        .star {
            font-size: 30px;
            cursor: pointer;
            color: gray;
        }
        .star.checked {
            color: gold;
        }
        textarea {
            width: 100%;
            height: 80px;
            margin-top: 10px;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            resize: none;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Califica el servicio de entrega</h2>
        <div class="stars">
            <span class="star" onclick="rateService(1)">★</span>
            <span class="star" onclick="rateService(2)">★</span>
            <span class="star" onclick="rateService(3)">★</span>
            <span class="star" onclick="rateService(4)">★</span>
            <span class="star" onclick="rateService(5)">★</span>
        </div>
        <textarea id="comment" placeholder="Deja tu comentario..."></textarea>
        <button onclick="submitRating()">Enviar Calificación</button>
    </div>

    <script>
        let selectedRating = 0;

        function rateService(stars) {
            selectedRating = stars;
            let starElements = document.querySelectorAll('.star');
            starElements.forEach((star, index) => {
                star.classList.toggle('checked', index < stars);
            });
        }

        function submitRating() {
            let comment = document.getElementById("comment").value;
            if (selectedRating === 0) {
                alert("Por favor, selecciona una calificación.");
                return;
            }
            alert(`Gracias por tu calificación de ${selectedRating} estrellas.\nComentario: ${comment}`);
            document.getElementById("comment").value = "";
            rateService(0); // Reiniciar las estrellas
        }
    </script>

</body>
</html>
